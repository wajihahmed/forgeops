apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ds-cts
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: ds
        resources: {}
        imagePullPolicy: IfNotPresent
      initContainers:
      - name: init
        resources: {}
        imagePullPolicy: IfNotPresent
  volumeClaimTemplates:
  - metadata:
      name: data
      annotations:
        pv.beta.kubernetes.io/gid: '0'
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: local-path
