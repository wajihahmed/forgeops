apiVersion: v1
kind: ConfigMap
metadata:
  name: am-catalina-properties
data:
  catalina.properties: |
    # Licensed to the Apache Software Foundation (ASF) under one or more
    # contributor license agreements.  See the NOTICE file distributed with
    # this work for additional information regarding copyright ownership.
    # The ASF licenses this file to You under the Apache License, Version 2.0
    # (the "License"); you may not use this file except in compliance with
    # the License.  You may obtain a copy of the License at
    #
    #     http://www.apache.org/licenses/LICENSE-2.0
    #
    # Unless required by applicable law or agreed to in writing, software
    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.

    package.access=sun.,org.apache.catalina.,org.apache.coyote.,org.apache.jasper.,org.apache.tomcat.
    package.definition=sun.,java.,org.apache.catalina.,org.apache.coyote.,\
    org.apache.jasper.,org.apache.naming.,org.apache.tomcat.

    common.loader="${catalina.base}/lib","${catalina.base}/lib/*.jar","${catalina.home}/lib","${catalina.home}/lib/*.jar"
    server.loader=
    shared.loader=

    tomcat.util.scan.StandardJarScanFilter.jarsToSkip=\
    annotations-api.jar,\
    ant-junit*.jar,\
    ant-launcher*.jar,\
    ant*.jar,\
    asm-*.jar,\
    aspectj*.jar,\
    bcel*.jar,\
    biz.aQute.bnd*.jar,\
    bootstrap.jar,\
    catalina-ant.jar,\
    catalina-ha.jar,\
    catalina-ssi.jar,\
    catalina-storeconfig.jar,\
    catalina-tribes.jar,\
    catalina.jar,\
    cglib-*.jar,\
    cobertura-*.jar,\
    commons-beanutils*.jar,\
    commons-codec*.jar,\
    commons-collections*.jar,\
    commons-compress*.jar,\
    commons-daemon.jar,\
    commons-dbcp*.jar,\
    commons-digester*.jar,\
    commons-fileupload*.jar,\
    commons-httpclient*.jar,\
    commons-io*.jar,\
    commons-lang*.jar,\
    commons-logging*.jar,\
    commons-math*.jar,\
    commons-pool*.jar,\
    derby-*.jar,\
    dom4j-*.jar,\
    easymock-*.jar,\
    ecj-*.jar,\
    el-api.jar,\
    geronimo-spec-jaxrpc*.jar,\
    h2*.jar,\
    ha-api-*.jar,\
    hamcrest-*.jar,\
    hibernate*.jar,\
    httpclient*.jar,\
    icu4j-*.jar,\
    jakartaee-migration-*.jar,\
    jasper-el.jar,\
    jasper.jar,\
    jaspic-api.jar,\
    jaxb-*.jar,\
    jaxen-*.jar,\
    jaxws-rt-*.jar,\
    jdom-*.jar,\
    jetty-*.jar,\
    jmx-tools.jar,\
    jmx.jar,\
    jsp-api.jar,\
    jstl.jar,\
    jta*.jar,\
    junit-*.jar,\
    junit.jar,\
    log4j*.jar,\
    mail*.jar,\
    objenesis-*.jar,\
    oraclepki.jar,\
    org.hamcrest.core_*.jar,\
    org.junit_*.jar,\
    oro-*.jar,\
    servlet-api-*.jar,\
    servlet-api.jar,\
    slf4j*.jar,\
    taglibs-standard-spec-*.jar,\
    tagsoup-*.jar,\
    tomcat-api.jar,\
    tomcat-coyote.jar,\
    tomcat-coyote-ffm.jar,\
    tomcat-dbcp.jar,\
    tomcat-i18n-*.jar,\
    tomcat-jdbc.jar,\
    tomcat-jni.jar,\
    tomcat-juli-adapters.jar,\
    tomcat-juli.jar,\
    tomcat-util-scan.jar,\
    tomcat-util.jar,\
    tomcat-websocket.jar,\
    tools.jar,\
    unboundid-ldapsdk-*.jar,\
    websocket-api.jar,\
    websocket-client-api.jar,\
    wsdl4j*.jar,\
    xercesImpl.jar,\
    xml-apis.jar,\
    xmlParserAPIs-*.jar,\
    xmlParserAPIs.jar,\
    xom-*.jar

    tomcat.util.scan.StandardJarScanFilter.jarsToScan=\
    log4j-taglib*.jar,\
    log4j-jakarta-web*.jar,\
    log4javascript*.jar,\
    slf4j-taglib*.jar

    tomcat.util.buf.StringCache.byte.enabled=true
    org.apache.el.GET_CLASSLOADER_USE_PRIVILEGED=false
