kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
components:
- ../image-defaulter
resources:
- ../../../base/am/secret-generator
patches:
- path: deployment.yaml
- path: ingress-fqdn.yaml
  target:
    group: networking.k8s.io
    version: v1
    kind: Ingress
    name: am
- path: service.yaml
  target:
    version: v1
    kind: Service
    name: am
namespace: fr-platform
