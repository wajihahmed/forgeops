apiVersion: apps/v1
kind: Deployment
metadata:
  name: idm
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      containers:
      - name: openidm
        resources:
          requests:
            memory: 2Gi
            cpu: 250m
          limits:
            memory: 2Gi
            cpu: "2"
        envFrom:
        - configMapRef:
            name: idm
        - configMapRef:
            name: esv-variables
            optional: true
        - secretRef:
            name: esv-secrets
            optional: true
        volumeMounts:
        - name: idm-boot-properties
          mountPath: /opt/openidm/resolver/boot.properties
          subPath: boot.properties
        imagePullPolicy: Always
      volumes:
      - name: idm-boot-properties
        configMap:
          name: idm-boot-properties
      initContainers:
      - name: custom-vol-init
        image: config-loader:local
        imagePullPolicy: IfNotPresent
        env:
        - name: GIT_URL
          value: "http://gitea.fr-platform.svc.cluster.local:3000/forgerock/customer-config.git"
        - name: GIT_PATH
          value: "/tmp/customer-config"
        - name: CONFIG_SRC_PATH
          value: "idm"
        - name: DESTINATION_PATH
          value: "/custom/config"
        - name: CONFIG_LOAD_STRATEGY
          value: "JSON_REPLACE"
        - name: BRANCH
          value: "master"
        command: ["clone-and-copy"]
        volumeMounts:
        - mountPath: /custom
          name: custom
        resources: {}
      - name: filesystem-init
        resources: {}
        imagePullPolicy: Always
      - name: truststore-init
        resources: {}
