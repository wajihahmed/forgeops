kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
components:
- ../image-defaulter
resources:
- ../../../base/idm/secret-generator
- idm-fbc-pvc.yaml
- boot-properties-cm.yaml
patches:
- path: deployment.yaml
- path: fbc-pvc-patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: idm
- path: ingress-fqdn.yaml
  target:
    group: networking.k8s.io
    version: v1
    kind: Ingress
    name: idm
namespace: fr-platform
