apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-shim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-shim
  template:
    metadata:
      labels:
        app: tenant-shim
    spec:
      serviceAccountName: tenant-shim
      containers:
        - name: tenant-shim
          image: tenant-shim
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
